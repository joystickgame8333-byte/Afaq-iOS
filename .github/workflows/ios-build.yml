name: Build and publish Afaq iPhone preview
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_preview:
        description: Launch simulator and attach native screenshots
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: afaq-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-preview:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain and prepare assets
        run: |
          set -euo pipefail
          xcodebuild -version
          bash tools/prepare-assets.sh
      - name: Verify prayer engine
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -parse-as-library Afaq/PrayerCalendarEngine.swift Afaq/PrayerCities.swift tools/PrayerEngineTests.swift -o /tmp/afaq-prayer-tests
          /tmp/afaq-prayer-tests Afaq/PrayerCalendar/prayer-calendar-v1.json
      - name: Build iPhone package
        run: |
          set -euo pipefail
          xcodebuild -project Afaq.xcodeproj -scheme Afaq \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > device-build.log 2>&1 || { tail -n 100 device-build.log; exit 1; }
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Afaq.app build/package/Payload/
          test -f build/package/Payload/Afaq.app/Afaq
          test -f build/package/Payload/Afaq.app/Assets.car
          test -f build/package/Payload/Afaq.app/ElMessiri-Variable.ttf
          test -f build/package/Payload/Afaq.app/default.metallib
          find build/package/Payload/Afaq.app -name prayer-calendar-v1.json | grep -q .
          cd build/package
          zip -qry ../Afaq.ipa Payload
      - name: Build simulator preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_preview }}
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for rows in devices.values() for d in rows if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcodebuild -project Afaq.xcodeproj -scheme Afaq \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO \
            build > simulator-build.log 2>&1 || { tail -n 100 simulator-build.log; exit 1; }
      - name: Launch and capture native screens
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_preview }}
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/Afaq.app
          xcrun simctl launch "$SIMULATOR_ID" com.omaralasam.afaq
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Afaq-home.png
          xcrun simctl terminate "$SIMULATOR_ID" com.omaralasam.afaq
          xcrun simctl launch "$SIMULATOR_ID" com.omaralasam.afaq --preview-settings
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/Afaq-settings.png
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="preview-$GITHUB_RUN_NUMBER"
          cat > build/release-notes.md <<'NOTES'
          أفق — ربط مواقيت صلاتي.

          - نفس التقويم السنوي المضمّن في تطبيق صلاتي، مع فروق المدن والتوقيت الصيفي Asia/Jerusalem.
          - صلاة قادمة وعد تنازلي مباشر، وتبديل جدول الغد بعد العشاء.
          - اختيار المدينة يدويًا أو تحديد أقرب مدينة بالموقع من الإعدادات؛ الافتراضي تل السبع.
          - المواقيت متاحة دون إنترنت؛ تحديث التقويم من مصدر صلاتي عند توفر الاتصال.
          - الحفاظ على المسيري والأرقام 1234 والزجاج حول وقت الصلاة والخلفيات المتغيّرة.
          - الشروق يظهر في الجدول ولا يدخل في الصلاة القادمة. لا نافذة عند الضغط على الصلاة.

          التنبيهات والأذان والقبلة لم تُفعّل في هذه الدفعة. معاينة المظهر داخل الإعدادات بأوقات توضيحية ثابتة.
          يتطلب iOS 18 أو أحدث، مع زجاج النظام على iOS 26 أو أحدث.
          ملف IPA غير موقّع، للتثبيت بالطريقة المعتادة لديك.
          NOTES
          gh release create "$TAG" build/Afaq.ipa \
            --target "$GITHUB_SHA" --title "أفق — مواقيت صلاتي $GITHUB_RUN_NUMBER" \
            --notes-file build/release-notes.md --prerelease
          if [ -f build/Afaq-home.png ] && [ -f build/Afaq-settings.png ]; then
            gh release upload "$TAG" build/Afaq-home.png build/Afaq-settings.png
          fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Afaq-build-diagnostics
          path: |
            device-build.log
            simulator-build.log
            build/Afaq-home.png
            build/Afaq-settings.png
          if-no-files-found: ignore
